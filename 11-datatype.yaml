- name : practice on data types
  hosts: local
  connection: local
  vars:
    PROGRAM: "Devops with aws" # string
    DURATION: 120 #int/number
    IS_LIVE: true #bool 
    DETAILS: 
      MONTHS: 4
      TRAINER: "Sivakurmar"
    TOPICS:
    - Linux
    - shell
    - Ansible
  tasks:
  - name: print variables
    ansible.builtin.debug:
      msg: |
        Program: {{ PROGRAM }}
        Duration: {{ DURATION }}
        Is_Live?: {{ IS_LIVE }}
        Details: {{ DETAILS }}
        Topics: {{ TOPICS }}