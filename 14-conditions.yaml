- name: grathering facts
  hosts: local
  connection: local
  tasks:
  - name: print grathering facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"


  - name: check RedHat or not
    ansible.builtin.debug:
      msg: "yes, package manager is RedHat"
    when: ansible_facts.os_family == "RedHat"